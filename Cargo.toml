[package]
name = "simply_ip_vault"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2", features = ["sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "2", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
ipnetwork = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hmac = "0.13"
tower-http = { version = "0.7", features = ["fs", "trace"] }
hex = "0.4"
rand = "0.10"
thiserror = "2"
dotenvy = "0.15"
log = "0.4"
# Primary AEAD for `signing_secret` at rest. XChaCha20's 192-bit nonce makes per-message random
# nonces collision-safe without any counter state to persist — see `src/crypto.rs`.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom"] }
# Retained for the *read-only* legacy path: rows sealed as `aesgcm256:` by earlier versions must
# stay openable. Nothing in this crate writes AES-GCM any more.
aes-gcm = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", features = ["macros"] }
