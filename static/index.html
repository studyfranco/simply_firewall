<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simply Firewall Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Simply Firewall</h1>
            </div>
            <div class="api-key-container">
                <input type="password" id="api-key-input" placeholder="Enter X-API-Key..." class="input-field header-input">
                <button id="refresh-btn" class="btn btn-secondary">Refresh Data</button>
            </div>
        </header>

        <main class="main-content">
            <div class="grid-layout">
                <section class="card form-section">
                    <h2>Manage Access</h2>
                    <p class="subtitle">Add a new IP address or CIDR to the firewall.</p>
                    
                    <form id="manage-form" class="manage-form">
                        <div class="form-group">
                            <label for="ip-address">IP Address or CIDR <span>*</span></label>
                            <input type="text" id="ip-address" placeholder="e.g. 192.168.1.50 or 10.0.0.0/24" required class="input-field">
                        </div>
                        
                        <div class="form-group">
                            <label for="group-id">Group ID (Optional)</label>
                            <input type="text" id="group-id" placeholder="UUID" class="input-field">
                        </div>
                        
                        <div class="form-group">
                            <label for="cause">Cause/Reason (Optional)</label>
                            <input type="text" id="cause" placeholder="Reason for ban or whitelist" class="input-field">
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" id="btn-ban" class="btn btn-danger">Ban IP</button>
                            <button type="button" id="btn-white" class="btn btn-success">Whitelist IP</button>
                        </div>
                        
                        <div id="form-message" class="message hidden"></div>
                    </form>
                </section>

                <section class="card list-section">
                    <div class="list-header">
                        <h2>Recent IP Records</h2>
                        <div class="filters">
                            <select id="status-filter" class="input-field select-field">
                                <option value="">All</option>
                                <option value="ban">Banned</option>
                                <option value="white">Whitelisted</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <table id="ip-table" class="data-table">
                            <thead>
                                <tr>
                                    <th>Address</th>
                                    <th>Status</th>
                                    <th>Group ID</th>
                                    <th>Updated At</th>
                                </tr>
                            </thead>
                            <tbody id="ip-table-body">
                                <tr>
                                    <td colspan="4" class="text-center text-muted">Loading data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="pagination">
                        <button id="btn-prev" class="btn btn-icon" disabled>&laquo; Prev</button>
                        <span id="page-indicator">Page 1</span>
                        <button id="btn-next" class="btn btn-icon">Next &raquo;</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
