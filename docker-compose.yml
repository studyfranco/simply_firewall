version: '3.8'

services:
  simply-ip-vault:
    build: .
    container_name: simply_ip_vault
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=sqlite://data/simply_ip_vault.db?mode=rwc
      - RUST_LOG=info
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Mirrors the Dockerfile's HEALTHCHECK so `docker compose ps` reports health even when the image
    # is overridden. `/ready` is unauthenticated by design — see src/api/system.rs — so the probe
    # needs no credential baked into the compose file, which is the whole reason it can exist here.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
